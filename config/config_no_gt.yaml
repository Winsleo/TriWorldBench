# Triworld Benchmark Evaluation Configuration — NO-GT mode (test_dataset style)
# Used for: test_dataset local eval (no real GT frames / no STATE).
# Workflow: 1) preprocess -> 2) build_fake_gt.py -> 3) run_eval this config

# --- Evaluation Input ---
eval_input: generate/a2v_test_dataset_20260902_220745_latest

# --- Metrics Selection (5 GT-free only — never use FAKE GT) ---
# TWB-Score on test_dataset must NOT mix scores computed against the FAKE GT
# scaffold (test_data/test/gt_dataset) — those numbers are meaningless and would
# inflate the aggregate. Excluded:
#   3 background_consistency, 5 flow_score, 7 photometric_smoothness,
#   11 subject_consistency  -- all read GT frames
#   4 dynamic_state_alignment, 12 trajectory_accuracy  -- need real STATE
#   13/14/15 vlm_consistency, 16 VQA  -- need VQA annotations not bundled
# Survivors (5):
#   0 Instruction_Following (VLM, gen vs instruction)
#   1 Interaction_Quality (VLM)
#   2 Perspectivity (VLM)
#  17 aesthetic_quality (pyiqa on gen only)
#  18 image_quality (pyiqa on gen only)
metrics: [0, 1, 2, 17, 18]
skip_auto_dependencies: true

# --- Output ---
output_dir: output

# --- Runtime ---
parallel_per_gpu: 4
metric_parallel_per_gpu:
  background_consistency: 1
  semantic_alignment: 1
  subject_consistency: 2
gpu_list: "4"
python: /disk/worldmodel/uv/envs/triworldbench/bin/python

# --- Model Weights ---
weights_root: ./weights

# --- Data References ---
# Test bundle (500 ep, FAKE GT scaffold). Pair with test_data/test/{gt_dataset,STATE,test_dataset}.
gt_dataset: test_data/test/gt_dataset
STATE: test_data/test/STATE
hyperparameters: config/hyperparameters.yaml

# --- Preprocessing Defaults ---
preprocess:
  target_width: 320
  target_height: 240
  align_mode: match_gt
  workers: 8

# --- VLM Consistency (unused in 5-GT-free mode but listed for completeness) ---
vlm_reference_db: test_data/val/vlm_data_base
vlm_max_new_tokens: 1024

# --- Episode Weights ---
episode_weights: true

# --- Advanced ---
resume: false
